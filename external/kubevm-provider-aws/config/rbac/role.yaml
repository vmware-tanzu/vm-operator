---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubevm-provider-aws-manager-role
rules:
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - create
  - get
  - update
- apiGroups:
  - infrastructure.kube-vm.io
  resources:
  - awsmachines
  verbs:
  - delete
  - get
  - list
  - patch
  - watch
- apiGroups:
  - infrastructure.kube-vm.io
  resources:
  - awsmachines/status
  verbs:
  - get
  - patch
- apiGroups:
  - kube-vm.io
  resources:
  - virtualmachines
  verbs:
  - get
  - list
  - patch
  - watch
- apiGroups:
  - kube-vm.io
  resources:
  - virtualmachines/finalizers
  verbs:
  - update
- apiGroups:
  - kube-vm.io
  resources:
  - virtualmachines/status
  verbs:
  - get
  - patch
