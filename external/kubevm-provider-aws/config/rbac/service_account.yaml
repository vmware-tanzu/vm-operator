apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubevm-provider-aws-manager
  namespace: kubevm-provider-aws-system
  # On EKS, delete the credentials Secret and annotate this account instead:
  #   eks.amazonaws.com/role-arn: arn:aws:iam::<account>:role/<role>
  # The SDK's chain then finds an IRSA token at a different step, and the
  # manager's code is unchanged. The deployment changes; the code does not.
