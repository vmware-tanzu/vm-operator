name: coverage-tools

on:
  pull_request:
    branches:
    - main
    - 'release/**'
    paths:
    - '.github/workflows/coverage-tools.yml'
    - 'Makefile'
    - 'Dockerfile.coverage'
    - 'Dockerfile.e2e'
    - 'main.go'
    - 'main*coverage.go'
    - 'test/coverage/**'
    - 'cmd/coverage-export/**'
    - 'hack/e2e/coverage.py'
    - 'hack/e2e/*coverage.sh'
    - 'hack/e2e/run-e2e.sh'
    - 'hack/e2e/tests/**'
    - '**/go.mod'
    - '**/go.sum'
  push:
    branches:
    - main
    paths:
    - '.github/workflows/coverage-tools.yml'
    - 'Makefile'
    - 'Dockerfile.coverage'
    - 'Dockerfile.e2e'
    - 'main.go'
    - 'main*coverage.go'
    - 'test/coverage/**'
    - 'cmd/coverage-export/**'
    - 'hack/e2e/coverage.py'
    - 'hack/e2e/*coverage.sh'
    - 'hack/e2e/run-e2e.sh'
    - 'hack/e2e/tests/**'
    - '**/go.mod'
    - '**/go.sum'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-e2e-coverage-tools:
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@v7
    - name: Install Go
      uses: actions/setup-go@v7
      with:
        go-version-file: 'go.mod'
        cache: true
        cache-dependency-path: '**/go.sum'
    - name: Install Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'
    - name: Test live-process coverage exports and runner lifecycle
      run: python3 -m unittest discover -s hack/e2e/tests -p test_coverage.py -v
