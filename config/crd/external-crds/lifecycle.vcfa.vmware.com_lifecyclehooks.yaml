kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: lifecyclehooks.lifecycle.vcfa.vmware.com
spec:
  group: lifecycle.vcfa.vmware.com
  names:
    kind: LifecycleHook
    listKind: LifecycleHookList
    plural: lifecyclehooks
    shortNames:
    - lh
    singular: lifecyclehook
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: Target group
      jsonPath: .spec.target.group
      name: Target Group
      type: string
    - description: Target kind
      jsonPath: .spec.target.kind
      name: Target Kind
      type: string
    - description: Stage name
      jsonPath: .spec.stage
      name: Stage
      type: string
    - description: Hook executor
      jsonPath: .spec.executor.name
      name: Executor
      type: string
    - description: Time since creation
      jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          LifecycleHook is the Schema for the lifecyclehooks API.

          A LifecycleHook registers one actor's interest in pausing one stage of one
          target (group, kind) in a namespace. Lifecycle Operator fans out the union
          of all registered hooks for a stage into the status of the target's
          LifecycleState.

          VM Operator vendors this type for API completeness only. It does not read
          or list LifecycleHook directly; hook discovery is done via
          LifecycleSubscribedStages.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: LifecycleHookSpec is the declared intent of a LifecycleHook.
            properties:
              executor:
                description: LifecycleHookExecutor identifies who executes the hook.
                properties:
                  name:
                    type: string
                required:
                - name
                type: object
              stage:
                type: string
              target:
                description: LifecycleHookTarget identifies a (group, kind) pair that
                  the hook targets.
                properties:
                  group:
                    type: string
                  kind:
                    type: string
                required:
                - group
                - kind
                type: object
              timeoutPolicy:
                description: LifecycleHookTimeoutPolicy specifies the timeout for
                  a hook.
                properties:
                  duration:
                    type: string
                  policy:
                    type: string
                type: object
            required:
            - stage
            - target
            type: object
        type: object
    served: true
    storage: true
    subresources: {}
